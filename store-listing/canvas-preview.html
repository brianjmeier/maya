<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuesday standup</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #17191d; color: #f3efe7; }
      main { max-width: 1040px; margin: 0 auto; padding: 48px 32px; }
      p { color: #f4c95d; font-size: 12px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0 0 28px; font-size: 42px; letter-spacing: -.04em; }
      .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      section { min-height: 540px; padding: 16px; border: 1px solid #393d44; border-radius: 18px; background: #202328; }
      h2 { margin: 0 0 14px; color: #aeb1b7; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
      article { margin: 10px 0; padding: 16px; border-radius: 12px; background: #292c32; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p>Launch room · Tuesday standup</p>
      <h1>What’s moving today?</h1>
      <div class="board">
        <section><h2>Up next</h2><article>Polish onboarding</article><article>Write release notes</article></section>
        <section><h2>In progress</h2><article>Prepare launch checklist</article><article>Review mobile handoff</article></section>
        <section><h2>Done</h2><article>Resolve checkout edge case</article><article>Ship dashboard filters</article></section>
      </div>
    </main>
    <script>
      const localStore = {
        timerState: {
          schemaVersion: 1,
          status: "idle",
          durationMs: 90_000,
          deadlineEpochMs: null,
          pausedRemainingMs: 90_000,
          revision: 0,
          updatedAt: Date.now(),
        },
        overlayPosition: { right: 240, top: 24 },
      };
      const storageListeners = new Set();
      window.chrome = {
        runtime: {
          id: "canvas-preview",
          lastError: null,
          getURL: (path) => `/extension/${path}`,
          sendMessage(message, callback) {
            if (message.type === "MAYA_TIMER_ACTION" && message.action === "set-duration") {
              localStore.timerState = {
                ...localStore.timerState,
                status: "idle",
                durationMs: message.durationMs,
                pausedRemainingMs: message.durationMs,
              };
            }
            callback({ ok: true, state: localStore.timerState });
          },
        },
        storage: {
          local: {
            get: async (keys) => Object.fromEntries(
              (Array.isArray(keys) ? keys : [keys]).map((key) => [key, localStore[key]]),
            ),
            set: async (values) => Object.assign(localStore, values),
            onChanged: {
              addListener: (listener) => storageListeners.add(listener),
              removeListener: (listener) => storageListeners.delete(listener),
            },
          },
        },
      };
    </script>
    <script src="/extension/overlay.js"></script>
  </body>
</html>
